version: '3.8'

services:
  # ==========================================
  # Backend API Flask + RDFLib
  # ==========================================
  backend:
    image: aldovasquez07/back_biolinked_ontology:latest
    container_name: biolinked-backend
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "1", "--threads", "4", "--timeout", "120", "wsgi:app"]
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=wsgi.py
      - PYTHONUNBUFFERED=1
      - CORS_ORIGIN=*
    networks:
      - biolinked-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs

  # ==========================================
  # Frontend Vue.js + Nginx
  # ==========================================
  frontend:
    image: aldovasquez07/front_biolinked_ontology:latest
    container_name: biolinked-frontend
    user: root
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - biolinked-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

# ==========================================
# Red compartida
# ==========================================
networks:
  biolinked-network:
    driver: bridge

# ==========================================
# Volúmenes para persistencia
# ==========================================
volumes:
  backend-data:
    driver: local
  backend-logs:
    driver: local